name: Android ARM64 Debug
on:
  workflow_dispatch:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify web extractors
        run: |
          node tests/extractors.test.cjs
          for file in app/src/main/assets/*.js; do node --check "$file"; done
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JavCatalog-Android-Debug
          path: app/build/outputs/apk/debug/*.apk
